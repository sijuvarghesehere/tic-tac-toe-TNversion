<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>TV vs JV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- TITLE -->
        <h1>TV <span>vs</span> JV</h1>


        <!-- SCOREBOARD -->
        <section class="scoreboard">

            <div class="score-card tv-card">
                <div class="player-label">TV</div>
                <div class="score-number" id="tvScore">0</div>
            </div>

            <div class="score-card draw-card">
                <div class="player-label">DRAW</div>
                <div class="score-number" id="drawScore">0</div>
            </div>

            <div class="score-card jv-card">
                <div class="player-label">JV</div>
                <div class="score-number" id="jvScore">0</div>
            </div>

        </section>


        <!-- STATUS -->
        <div
            class="status"
            id="status"
            aria-live="polite"
        >
            TV's Turn
        </div>


        <!-- BOARD WRAPPER -->
        <div class="board-wrapper">

            <!-- BOARD -->
            <div
                class="board"
                id="board"
                role="grid"
                aria-label="Tic Tac Toe board"
            >

                <button
                    class="cell"
                    data-index="0"
                    aria-label="Tile 1"
                ></button>

                <button
                    class="cell"
                    data-index="1"
                    aria-label="Tile 2"
                ></button>

                <button
                    class="cell"
                    data-index="2"
                    aria-label="Tile 3"
                ></button>

                <button
                    class="cell"
                    data-index="3"
                    aria-label="Tile 4"
                ></button>

                <button
                    class="cell"
                    data-index="4"
                    aria-label="Tile 5"
                ></button>

                <button
                    class="cell"
                    data-index="5"
                    aria-label="Tile 6"
                ></button>

                <button
                    class="cell"
                    data-index="6"
                    aria-label="Tile 7"
                ></button>

                <button
                    class="cell"
                    data-index="7"
                    aria-label="Tile 8"
                ></button>

                <button
                    class="cell"
                    data-index="8"
                    aria-label="Tile 9"
                ></button>

            </div>


            <!-- WINNING STRIKE -->
            <div
                class="strike"
                id="strike"
            ></div>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

            <button
                class="main-button"
                id="nextRound"
            >
                Next Round
            </button>

            <button
                class="secondary-button"
                id="resetScore"
            >
                Reset Score
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
