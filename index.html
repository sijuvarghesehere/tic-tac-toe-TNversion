<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV vs JV - Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- TITLE -->
        <h1>TV vs JV</h1>


        <!-- SCOREBOARD -->
        <div class="scoreboard">

            <div class="score-box tv-score">
                <div class="player-name">TV</div>
                <div class="score" id="tvScore">0</div>
            </div>

            <div class="score-box draw-score">
                <div class="player-name">DRAW</div>
                <div class="score" id="drawScore">0</div>
            </div>

            <div class="score-box jv-score">
                <div class="player-name">JV</div>
                <div class="score" id="jvScore">0</div>
            </div>

        </div>


        <!-- GAME STATUS -->
        <div class="status" id="status">
            TV's Turn
        </div>


        <!-- GAME BOARD -->
        <div class="board" id="board">

            <!-- ROW 1 -->
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>

            <!-- ROW 2 -->
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>

            <!-- ROW 3 -->
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>


            <!-- WINNING STRIKE -->

            <div
                class="strike"
                id="strike">
            </div>

        </div>


        <!-- GAME BUTTONS -->
        <div class="buttons">

            <button id="restart">
                Next Round
            </button>

            <button
                id="resetScore"
                class="reset-score">
                Reset Score
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
